<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 435 50"
  style="background-color: #000000"
  width="650px"
  height="75px"
>
  <style>
    @font-face {
      font-family: "Bitcount";
      font-style: normal;
      font-weight: 400;
      font-display: fallback;
      src: url(data:font/truetype;base64,)
        format("truetype");
    }
  </style>

  <path id="path0">
    <!-- Single line -->
    <animate
      id="d0"
      attributeName="d"
      begin="0s;d4.end"
      dur="6000ms"
      fill="remove"
      values="m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h0"
      keyTimes="0;0.66666666666667;0.83333333333333;1"
    />
  </path>
  <text
    font-family='"Bitcount", monospace'
    fill="#00C950"
    font-size="20"
    dominant-baseline="middle"
    x="0%"
    text-anchor="start"
    letter-spacing="normal"
  >
    <textPath xlink:href="#path0">ㅤ~$ Hi my name is Masensen.</textPath>
  </text>
  <path id="path1">
    <!-- Single line -->
    <animate
      id="d1"
      attributeName="d"
      begin="d0.end"
      dur="6000ms"
      fill="remove"
      values="m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h0"
      keyTimes="0;0.66666666666667;0.83333333333333;1"
    />
  </path>
  <text
    font-family='"Bitcount", monospace'
    fill="#00C950"
    font-size="15"
    dominant-baseline="middle"
    x="0%"
    text-anchor="start"
    letter-spacing="normal"
  >
    <textPath xlink:href="#path1">
      ㅤ~$ You are not supposed to find this.
    </textPath>
  </text>
  <path id="path2">
    <!-- Single line -->
    <animate
      id="d2"
      attributeName="d"
      begin="d1.end"
      dur="6000ms"
      fill="remove"
      values="m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h0"
      keyTimes="0;0.66666666666667;0.83333333333333;1"
    />
  </path>
  <text
    font-family='"Bitcount", monospace'
    fill="#00C950"
    font-size="20"
    dominant-baseline="middle"
    x="0%"
    text-anchor="start"
    letter-spacing="normal"
  >
    <textPath xlink:href="#path2">ㅤ~$ No Gui, No problem.</textPath>
  </text>
  <path id="path3">
    <!-- Single line -->
    <animate
      id="d3"
      attributeName="d"
      begin="d2.end"
      dur="6000ms"
      fill="remove"
      values="m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h0"
      keyTimes="0;0.66666666666667;0.83333333333333;1"
    />
  </path>
  <text
    font-family='"Bitcount", monospace'
    fill="#00C950"
    font-size="20"
    dominant-baseline="middle"
    x="0%"
    text-anchor="start"
    letter-spacing="normal"
  >
    <textPath xlink:href="#path3">ㅤ~$ Build, Break, Rebuild.</textPath>
  </text>
  <path id="path4">
    <!-- Single line -->
    <animate
      id="d4"
      attributeName="d"
      begin="d3.end"
      dur="6000ms"
      fill="remove"
      values="m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h0"
      keyTimes="0;0.66666666666667;0.83333333333333;1"
    />
  </path>
  <text
    font-family='"Bitcount", monospace'
    fill="#00C950"
    font-size="20"
    dominant-baseline="middle"
    x="0%"
    text-anchor="start"
    letter-spacing="normal"
  >
    <textPath xlink:href="#path4">
      ㅤ~$ Before the shell blinks, I&#039;am.
    </textPath>
  </text>
</svg>
